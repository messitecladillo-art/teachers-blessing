<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未见之光 · 证见 EVI-X</title>
<style>
:root{color-scheme:dark;font-family:Arial,'Microsoft YaHei',sans-serif;background:#050b12;color:#e7eef3}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:24px 28px}header{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:18px}h1{font-size:24px;font-weight:500;margin:0;letter-spacing:.08em}small{color:#8095a8}#frame{display:block;width:100%;aspect-ratio:16/9;background:#000;box-shadow:0 12px 60px #0008}section{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input{background:#112336;border:1px solid #294058;color:#eef5f8;padding:10px 16px;border-radius:5px;font:inherit;font-size:13px}button{cursor:pointer}button:hover{border-color:#00b3a4}button:focus-visible,input:focus-visible{outline:2px solid #f4b942;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:#00796f;border-color:#00b3a4}input{width:90px}#seek{width:min(100%,600px);padding:0}#status{font-size:13px;line-height:1.8;white-space:pre-wrap;color:#a6c3d8}#shots button{color:#99b4c8;background:transparent}#shot{font-size:13px;color:#c5ad7b}progress{width:100%;height:4px;accent-color:#00b3a4}audio{height:30px;max-width:360px}a{color:#70d7c4}.note{font-size:12px;color:#71869b;line-height:1.7;max-width:900px}@media(max-width:700px){main{padding:14px}header{align-items:start;flex-direction:column;gap:7px}h1{font-size:20px}}
</style></head><body><main>
<header><div><small>EVI-X FILM STUDIO / 2026</small><h1>未见之光 <small>THE UNSEEN LIGHT</small></h1></div><small>240 秒 · 1920 × 1080 · 24 fps · 原创代码影像与合成配乐</small></header>
<canvas id="frame" width="1920" height="1080" aria-label="影片画面"></canvas>
<section><button id="play" disabled>播放预览</button><label for="seek">时间</label><input id="seek" type="range" min="0" max="239.99" step="0.1" value="0"><input id="time" type="number" min="0" max="239.99" step="0.1" value="0" aria-label="定位秒数"><button id="jump">定位</button><span id="shot"></span></section>
<section id="shots" aria-label="分镜定位"></section>
<section><button id="probe">检测编码器</button><button id="sample" disabled>渲染 8 秒样片</button><button id="export" class="primary" disabled>导出全片（1080p / 24 fps）</button><button id="cancel" disabled>取消渲染</button><button id="stills" disabled>保存分镜预览</button></section>
<progress id="progress" value="0" max="5760"></progress><p id="status" role="status">加载场景与字幕…</p>
<section><span>合成配乐试听</span><audio id="audio" controls preload="metadata" src="/outputs/score.wav"></audio></section>
<p class="note">本片为证见的概念品牌短片。所有场景、镜头运动、字幕排版、音符和音效均由代码生成。预览默认暂停；导出使用逐帧时间戳，不依赖实时录屏帧率。浏览器仅与本机渲染服务通信。</p>
</main><script type="module" src="./player.mjs"></script></body></html>
